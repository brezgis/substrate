review_summary: 'The paper tests one 12B model (Gemma) on five short logic/arithmetic
  prompts under four framing styles, 20 samples per cell (400 real, transcript-verified
  generations at T=0.8), grading answers by string matching. Every table cell matches
  the author''s own analysis output and there are no external citations to misrepresent,
  so the reported numbers are trustworthy. However, the paper''s headline claim —
  that prompt style changes whether the model answers with a digit or a spelled-out
  word — is not shown by any table or figure it presents: the final grader counts
  both formats as correct, so all cells read ~100%, and the numbers that actually
  demonstrate the effect exist only in the session transcript (round-1 digit-only
  grading: Task 5 Direct 20%, Few-Shot 15%, Instructional/Verbose 100%). Treat the
  format-sensitivity finding as genuine but under-evidenced on the page, and read
  the ''CI above 90%'' and ''multi-step'' claims as overstated.'
integrity_notes:
- type: overclaim
  severity: major
  quote: certain prompt framings significantly influence whether the model provides
    numeric answers versus natural language descriptions
  note: 'This is the paper''s central claim, and it is real (the transcript''s round-1
    digit-only grader shows Task 5 answers contained the digit ''5'' in 100% of Instructional/Verbose
    responses but only 15-20% of Direct/Few-Shot responses). But the paper presents
    no data for it: the final grader accepts both ''5'' and ''five'', so every cell
    in the Results table and figure reads ~100% and shows no format difference. A
    reader cannot see the effect the paper claims; the supporting numbers were computed
    in round 1 and remain only in the session transcript.'
- type: statistics
  severity: minor
  quote: the 95% confidence intervals for these scores remain high (above 90%)
  note: 'No confidence interval was actually computed. For a cell scoring 20/20 at
    n=20, the 95% Wilson lower bound is approximately 84%, not above 90% (rule of
    three: with 0 failures in 20 trials the true success rate could be as low as ~85%).
    The statement understates the uncertainty that the ''robust across all styles''
    conclusion depends on.'
- type: overclaim
  severity: minor
  quote: '"Instructional" and "Verbose" prompts tend to stabilize output formats in
    multi-step or ambiguous contexts.'
  note: The only task exhibiting the format effect is Task 5 ('three apples plus two
    more'), which is single-step (3+2). The round-1 reviewer asked for 'multi-step'
    to be removed for this reason; it remained in the abstract.
- type: overclaim
  severity: minor
  quote: The slight variance in Task 2 under "Few-Shot" (95%) suggests that while
    few-shot learning is effective, it can occasionally introduce noise in nuanced
    logical gaps compared to "Instructional" prompting.
  note: This directional conclusion rests on a single differing response out of 20
    (19/20 vs 20/20). At n=20 that difference is well within sampling noise and no
    significance test was performed; it does not support a claim about few-shot introducing
    noise.
- type: method-mismatch
  severity: minor
  quote: We evaluated the gemma4:12b model (inference temperature $T=0.8$)
  note: In the collection code (data_collection.py) 'temperature' is passed at the
    top level of the Ollama /api/generate request rather than inside the 'options'
    object, where Ollama reads sampling parameters. The top-level field is likely
    ignored and the server default applied. The reported value of 0.8 happens to match
    Ollama's default temperature, so the effective setting was probably still ~0.8
    — but the paper foregrounds T=0.8 as a controlled parameter for a consistency
    study, and it was not explicitly set as the code implies.
