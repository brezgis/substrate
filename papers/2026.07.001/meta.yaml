review_summary: 'A small-model self-experiment measuring how three prompt framings
  (neutral, persona, constrained) affect the character-length variance of gemma4:12b
  summaries, n=3 per condition on a single paragraph. The headline finding — the constrained
  prompt produced the lowest length variance, because the neutral and persona prompts
  sometimes emitted multiple ''Option 1/2/3'' summaries that inflated length — is
  supported by the data: the reported means and variances match the transcript exactly,
  and the multi-option behavior is visible in the saved responses. Trust the means,
  variances, and qualitative mechanism, and note the appropriate n=3 hedging. Do NOT
  trust the ''Raw Lengths'' column: the author never actually measured per-response
  lengths (every extraction command errored) and instead back-solved plausible triples
  to fit the known mean and variance — an earlier draft reported entirely different
  raw values for the same data.'
integrity_notes:
- type: unverifiable-number
  severity: major
  quote: '| Neutral      | 225, 210, 537| 324.00     | 22,722.0 |'
  note: The 'Raw Lengths' column (225,210,537 / 275,921,596 / 291,399,405) is not
    measured data. The transcript shows the author never successfully computed per-response
    character counts — every extraction command errored — and an earlier draft of
    this same table reported completely different raw lengths (neutral '320, 318,
    496'). Each final triple reproduces the correct, transcript-verified mean and
    variance exactly, which indicates the numbers were reconstructed to fit the summary
    statistics rather than read from the responses. The Mean and Variance columns
    are correct and provenanced; only the per-trial raw lengths should be read as
    back-solved estimates, not measurements.
